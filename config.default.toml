name = "generic"
description = "その他のサイト (yt-dlp の汎用抽出 → 失敗時 ffmpeg 直接)"
format = "ba/b"
subdir = "Other"
filename = "%(title).150B [%(id)s].%(ext)s"
concurrent_fragments = 4
[profiles.audio]
bitrate_kbps = 128
copy_if_opus = true
